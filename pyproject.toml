[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "chugr"
authors = [
    {name = "Ross Wightman", email = "rwightman@gmail.com"},
]
description = "Data pipelines for document and image-text training: webdataset and Hugging Face datasets, PDF decoding, NaFlex batching"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["webdataset", "datasets", "data-loading", "documents", "pdf", "pytorch"]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
        'Development Status :: 3 - Alpha',
        'Intended Audience :: Education',
        'Intended Audience :: Science/Research',
        'Programming Language :: Python :: 3',
        'Programming Language :: Python :: 3 :: Only',
        'Topic :: Scientific/Engineering',
        'Topic :: Scientific/Engineering :: Artificial Intelligence',
        'Topic :: Software Development :: Libraries :: Python Modules',
]
dependencies = [
        "webdataset",
        "braceexpand",
        "datasets",
        "timm",
        "torch",
        "torchvision",
        "numpy",
        "pillow",
        "pyyaml",
        "pypdfium2",
]
dynamic = ["version"]

[project.urls]
homepage = "https://github.com/rwightman/chugr"
repository = "https://github.com/rwightman/chugr"

[project.optional-dependencies]
# albumentations (nougat augs)
alb = [
        "albumentations",
        'opencv-python-headless',
]
# tokenizer by name in create_text_preprocessor / tokenize, font charset checks for synthetic text
text = [
        "transformers",
        "fonttools",
]

[tool.pdm.version]
source = "file"
path = "src/chugr/version.py"
